<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wreckfest Controller</title>
    <!-- Mirrors useAppearance before the first paint, so a dark page never flashes white. -->
    <script>
      try {
        var saved = localStorage.getItem('wreckfest.appearance')
        var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Toasts render here (App.vue): a live region, so screen readers announce them. -->
    <div id="messages" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
